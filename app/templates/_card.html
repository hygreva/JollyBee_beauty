<article class="product-card"><a href="{{ url_for('shop.product', slug=product.slug) }}"><div class="product-image"><img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy"></div><div class="card-copy"><span>{{ product.category }}</span><h3>{{ product.name }}</h3><p>{{ money(product.price_cents) }}</p></div></a></article>
